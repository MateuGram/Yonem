    background:linear-gradient(90deg,rgba(0,229,255,.16),rgba(10,20,32,.3));

    border-left:1px solid rgba(255,45,111,.35); border-color:rgba(255,45,111,.35);
    color:#ffb3c9; background:linear-gradient(90deg,rgba(255,45,111,.14),rgba(10,20,32,.35)); }
  #export:hover { color:#fff; border-color:#ff2d6f; box-shadow:0 0 24px rgba(255,45,111,.45); }

    font-family:'Segoe UI',system-ui,sans-serif; font-size:10px; letter-spacing:2px; color:#3f5a6d; }
  #status { position:fixed; bottom:18px; right:22px; z-index:10;

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",

<script type="module">
import * as THREE from 'three';
import { OrbitControls }    from 'three/addons/controls/OrbitControls.js';
import { GLTFExporter }     from 'three/addons/exporters/GLTFExporter.js';
import { EffectComposer }   from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass }       from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass }  from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass }       from 'three/addons/postprocessing/OutputPass.js';

/* === 1. RENDERER / SCENE / CAMERA === */
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x04050a);
scene.fog = new THREE.FogExp2(0x04050a, 0.010);

const camera = new THREE.PerspectiveCamera(40, window.innerWidth/window.innerHeight, 0.1, 600);
camera.position.set(9.0, 4.5, 10.5);

const controls = new OrbitControls(camera, canvas);
controls.target.set(0, 1.0, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.minDistance = 3;
controls.maxDistance = 60;
controls.maxPolarAngle = Math.PI * 0.492;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.55;

/* === 2. ENV === */
function buildEnvScene() {
  const s = new THREE.Scene();
  const room = new THREE.Mesh(new THREE.BoxGeometry(70, 34, 70),
    new THREE.MeshBasicMaterial({ color:0x05070f, side:THREE.BackSide, toneMapped:false }));
  s.add(room);
  const panel = (hex, mul, w, h, pos, rot) => {
    const col = new THREE.Color(hex).multiplyScalar(mul);
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h),
      new THREE.MeshBasicMaterial({ color: col, side:THREE.DoubleSide, toneMapped:false }));
    m.position.set(pos[0], pos[1], pos[2]);
    m.rotation.set(rot[0], rot[1], rot[2]);
    s.add(m);
  };
  panel(0x9fdcff, 4.5, 34, 4,  [0, 16.5, 0],  [Math.PI/2, 0, 0]);
  panel(0x00e5ff, 3.0, 22, 2,  [0, 15.0, -8], [Math.PI/2, 0, 0]);
  panel(0x00e5ff, 3.2, 4, 24,  [-16.5, 6, 0], [0,  Math.PI/2, 0]);
  panel(0xff2d6f, 3.0, 4, 24,  [ 16.5, 6, 0], [0, -Math.PI/2, 0]);
  panel(0x7c3aed, 2.6, 22, 3,  [0, 4, -16.5], [0, 0, 0]);
  panel(0x00e5ff, 2.2, 22, 3,  [0, 4,  16.5], [0, Math.PI, 0]);
  panel(0xffffff, 1.6, 14, 6,  [-6, 13, 9],   [Math.PI/2.4, 0, 0.4]);
  return s;
}
const pmrem = new THREE.PMREMGenerator(renderer);
pmrem.compileEquirectangularShader();
const envRT = pmrem.fromScene(buildEnvScene(), 0.03);
scene.environment = envRT.texture;
pmrem.dispose();

/* === 3. GROUND / GRID / RING === */
const ground = new THREE.Mesh(new THREE.PlaneGeometry(400, 400),
  new THREE.MeshStandardMaterial({ color:0x05060c, metalness:0.88, roughness:0.30, envMapIntensity:0.6 }));
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);

const grid = new THREE.GridHelper(400, 200, 0x0b4a60, 0x0d1730);
grid.material.transparent = true; grid.material.opacity = 0.38;
grid.position.y = 0.012; scene.add(grid);

const ringOuter = new THREE.Mesh(new THREE.RingGeometry(3.9, 4.05, 128),
  new THREE.MeshBasicMaterial({ color:0x00e5ff, toneMapped:false, side:THREE.DoubleSide,
    transparent:true, opacity:0.85 }));
ringOuter.rotation.x = -Math.PI/2; ringOuter.position.y = 0.025; scene.add(ringOuter);

const ringInner = new THREE.Mesh(new THREE.RingGeometry(3.55, 3.60, 128),
  new THREE.MeshBasicMaterial({ color:0xff2d6f, toneMapped:false, side:THREE.DoubleSide,
    transparent:true, opacity:0.6 }));
ringInner.rotation.x = -Math.PI/2; ringInner.position.y = 0.025; scene.add(ringInner);

/* === 4. LIGHTS === */
scene.add(new THREE.HemisphereLight(0x2c4c78, 0x07070d, 0.85));

const keyLight = new THREE.DirectionalLight(0xc4dcff, 2.4);
keyLight.position.set(9, 15, 7);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.left = -14;  keyLight.shadow.camera.right = 14;
keyLight.shadow.camera.top  =  14;  keyLight.shadow.camera.bottom = -14;
keyLight.shadow.camera.near = 1;   keyLight.shadow.camera.far = 60;
keyLight.shadow.bias = -0.0006; keyLight.shadow.normalBias = 0.02;
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0x3b6ea8, 1.0);
fillLight.position.set(-8, 6, -9); scene.add(fillLight);

const rimCyanLight = new THREE.PointLight(0x00e5ff, 260, 40, 2);
rimCyanLight.position.set(-12, 5.5, -9); scene.add(rimCyanLight);
const rimMagentaLight = new THREE.PointLight(0xff2d6f, 220, 40, 2);
rimMagentaLight.position.set(12, 5.0, -9); scene.add(rimMagentaLight);
const rimVioletLight = new THREE.PointLight(0x8b5cf6, 180, 40, 2);
rimVioletLight.position.set(0, 6.0, 12); scene.add(rimVioletLight);

/* === 5. MATERIALS === */
const M = {
  tire:    new THREE.MeshPhysicalMaterial({ color:0x0a0a0c, roughness:0.92, metalness:0.05, clearcoat:0.25 }),
  rimDark: new THREE.MeshPhysicalMaterial({ color:0x14161c, metalness:0.95, roughness:0.32, envMapIntensity:1.2 }),
  chrome:  new THREE.MeshPhysicalMaterial({ color:0xc9d2de, metalness:1.0,  roughness:0.14, envMapIntensity:1.5 }),
  carbon:  new THREE.MeshPhysicalMaterial({ color:0x0a0b10, metalness:0.55, roughness:0.55, clearcoat:0.7, clearcoatRoughness:0.25 }),
  dark:    new THREE.MeshPhysicalMaterial({ color:0x181a22, metalness:0.85, roughness:0.42 })
};
const paint = (hex) => new THREE.MeshPhysicalMaterial({
  color: hex, metalness: 0.90, roughness: 0.24,
  clearcoat: 1.0, clearcoatRoughness: 0.06, envMapIntensity: 1.45 });
const glassMat = () => new THREE.MeshPhysicalMaterial({
  color: 0x0a1020, metalness: 0.70, roughness: 0.05,
  envMapIntensity: 2.2, transparent: true, opacity: 0.35,
  clearcoat: 1.0, clearcoatRoughness: 0.03, depthWrite: false });
const neon = (hex, intensity = 2.5) => new THREE.MeshStandardMaterial({
  color: 0x000000, emissive: new THREE.Color(hex),
  emissiveIntensity: intensity, toneMapped: false, roughness: 0.35, metalness: 0.0 });

/* === 6. HELPERS === */
function extrude(pts, width, mat, bevel = 0.06, castShadow = true) {
  const shape = new THREE.Shape();
  shape.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) shape.lineTo(pts[i][0], pts[i][1]);
  shape.closePath();
  const depth = Math.max(0.02, width - bevel * 2);
  const geo = new THREE.ExtrudeGeometry(shape, {
    depth, bevelEnabled: bevel > 0, bevelThickness: bevel,
    bevelSize: bevel, bevelOffset: 0, bevelSegments: 2,
    curveSegments: 1, steps: 1 });
  geo.translate(0, 0, -depth / 2);
  geo.computeVertexNormals();
  const mesh = new THREE.Mesh(geo, mat);
  mesh.castShadow = castShadow; mesh.receiveShadow = castShadow;
  return mesh;
}
function makeWheel(radius, width, neonColor) {
  const g = new THREE.Group();
  const tire = new THREE.Mesh(
    new THREE.CylinderGeometry(radius, radius, width, 40, 1).rotateX(Math.PI/2), M.tire);
  tire.castShadow = true; g.add(tire);
  g.add(new THREE.Mesh(
    new THREE.CylinderGeometry(radius*0.68, radius*0.68, width*1.01, 32, 1).rotateX(Math.PI/2), M.rimDark));
  const spokeGeo = new THREE.BoxGeometry(radius*0.10, radius*1.30, width*0.55);
  for (let i = 0; i < 3; i++) {
    const s = new THREE.Mesh(spokeGeo, M.chrome);
    s.rotation.z = (i/3) * Math.PI; g.add(s);
  }
  g.add(new THREE.Mesh(
    new THREE.CylinderGeometry(radius*0.20, radius*0.20, width*1.06, 20, 1).rotateX(Math.PI/2), M.chrome));
  const ringGeo = new THREE.TorusGeometry(radius*0.74, radius*0.048, 8, 48);
  for (const z of [width/2 + 0.012, -width/2 - 0.012]) {
    const r = new THREE.Mesh(ringGeo, neon(neonColor, 3.0));
    r.position.z = z; g.add(r);
  }
  return g;
}
function addWheels(parent, positions, radius, width, neonColor, flare = true) {
  for (const [x, y, z] of positions) {
    const w = makeWheel(radius, width, neonColor);
    w.position.set(x, y, z); parent.add(w);
    if (flare) {
      const f = new THREE.Mesh(
        new THREE.TorusGeometry(radius*1.15, radius*0.11, 10, 30, Math.PI), M.carbon);
      f.position.set(x, y, z * 0.96); f.castShadow = true; parent.add(f);
    }
  }
}
function makeGlowTexture() {
  const size = 256; const c = document.createElement('canvas');
  c.width = c.height = size; const ctx = c.getContext('2d');
  const grd = ctx.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
  grd.addColorStop(0, 'rgba(255,255,255,1)');
  grd.addColorStop(0.30, 'rgba(255,255,255,0.42)');
  grd.addColorStop(0.65, 'rgba(255,255,255,0.10)');
  grd.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = grd; ctx.fillRect(0, 0, size, size);
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace; return tex;
}
const GLOW_TEX = makeGlowTexture();
const groundGlowMat = new THREE.MeshBasicMaterial({
  map: GLOW_TEX, color: 0x00e5ff, transparent: true,
  blending: THREE.AdditiveBlending, depthWrite: false, opacity: 0.85, toneMapped: false });
const groundGlow = new THREE.Mesh(new THREE.PlaneGeometry(14, 10), groundGlowMat);
groundGlow.rotation.x = -Math.PI/2; groundGlow.position.y = 0.03; scene.add(groundGlow);

/* === LICENSE PLATES (auto) === */
function makePlateTexture(letters = 'A000AA', region = '00') {
  const W = 1024, H = 224;
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#e6e6e6'; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = '#0a0a0a'; ctx.lineWidth = 12;
  ctx.strokeRect(8, 8, W - 16, H - 16);
  const flagW = 105, flagTop = 16, flagH = H - 32, stripeH = flagH / 3;
  ctx.fillStyle = '#ffffff'; ctx.fillRect(16, flagTop, flagW, stripeH);
  ctx.fillStyle = '#0039a6'; ctx.fillRect(16, flagTop + stripeH, flagW, stripeH);
  ctx.fillStyle = '#d52b1e'; ctx.fillRect(16, flagTop + stripeH * 2, flagW, stripeH);
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 32px Arial, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('RUS', 16 + flagW / 2, flagTop + flagH - 20);
  const regionW = 190;
  ctx.strokeStyle = '#0a0a0a'; ctx.lineWidth = 8;
  ctx.beginPath(); ctx.moveTo(W - regionW - 8, 8); ctx.lineTo(W - regionW - 8, H - 8); ctx.stroke();
  ctx.fillStyle = '#0a0a0a';
  ctx.font = 'bold 120px Arial, sans-serif';
  ctx.fillText(region, W - regionW / 2 - 8, H / 2 - 12);
  ctx.font = 'bold 30px Arial, sans-serif';
  ctx.fillText('RUS', W - regionW / 2 - 8, H / 2 + 62);
  ctx.font = 'bold 158px Arial, sans-serif';
  const centerX = (16 + flagW + (W - regionW - 8)) / 2;
  ctx.fillText(letters, centerX, H / 2 + 10);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 16;
  return tex;
}
function addLicensePlates(car, opts) {
  const { xFront, yFront, xRear, yRear,
    letters = 'A000AA', region = '00', width = 0.52, height = 0.11 } = opts;
  const frameMat = new THREE.MeshPhysicalMaterial({ color: 0x0a0a0a, roughness: 0.55, metalness: 0.35 });
  const frameDepth = 0.15;
  const texF = makePlateTexture(letters, region);
  const matF = new THREE.MeshBasicMaterial({ map: texF, side: THREE.DoubleSide, toneMapped: true });
  const fFrame = new THREE.Mesh(new THREE.BoxGeometry(frameDepth, height + 0.03, width + 0.03), frameMat);
  fFrame.position.set(xFront - frameDepth / 2, yFront, 0); fFrame.castShadow = true; car.add(fFrame);
  const fPlate = new THREE.Mesh(new THREE.PlaneGeometry(width, height), matF);
  fPlate.rotation.y = Math.PI / 2; fPlate.position.set(xFront + 0.012, yFront, 0); car.add(fPlate);
  const texR = makePlateTexture(letters, region);
  const matR = new THREE.MeshBasicMaterial({ map: texR, side: THREE.DoubleSide, toneMapped: true });
  const rFrame = new THREE.Mesh(new THREE.BoxGeometry(frameDepth, height + 0.03, width + 0.03), frameMat);
  rFrame.position.set(xRear + frameDepth / 2, yRear, 0); rFrame.castShadow = true; car.add(rFrame);
  const rPlate = new THREE.Mesh(new THREE.PlaneGeometry(width, height), matR);
  rPlate.rotation.y = -Math.PI / 2; rPlate.position.set(xRear - 0.012, yRear, 0); car.add(rPlate);
}

/* === COCKPIT === */
function makeCompactSeat(z, yFloor, xCenter, cabinH, mats) {
  const { leather, trim, accent } = mats;
  const g = new THREE.Group();
  g.position.set(xCenter, yFloor, z);
  const seatHeight = Math.min(0.50, cabinH * 0.85);
  const baseH  = seatHeight * 0.30;
  const backH  = seatHeight * 0.72;
  const cushionW = 0.42; const cushionD = 0.44; const tilt = 0.22;
  const base = new THREE.Mesh(new THREE.BoxGeometry(cushionD, baseH, cushionW), leather);
  base.position.set(0, baseH/2 + 0.012, 0); base.castShadow = true; g.add(base);
  const backX = -Math.sin(tilt) * backH * 0.5 - 0.05;
  const backY = baseH + Math.cos(tilt) * backH * 0.5 + 0.012;
  const back = new THREE.Mesh(new THREE.BoxGeometry(backH * 0.22, backH, cushionW * 0.98), leather);
  back.position.set(backX, backY, 0); back.rotation.z = tilt; back.castShadow = true; g.add(back);
  const headH = Math.min(0.11, backH * 0.26);
  const headX = -Math.sin(tilt) * backH - 0.05;
  const headY = baseH + Math.cos(tilt) * backH + headH * 0.5 + 0.012;
  const head = new THREE.Mesh(new THREE.BoxGeometry(backH * 0.18, headH, cushionW * 0.55), leather);
  head.position.set(headX, headY, 0); g.add(head);
  const stripe = new THREE.Mesh(new THREE.BoxGeometry(0.014, 0.014, cushionW * 0.78), accent);
  stripe.position.set(-Math.sin(tilt) * backH * 0.98 - 0.055,
    baseH + Math.cos(tilt) * backH * 0.98 + 0.015, 0); g.add(stripe);
  for (const s of [-1, 1]) {
    const bol = new THREE.Mesh(new THREE.BoxGeometry(cushionD * 0.70, baseH * 1.20, 0.04), trim);
    bol.position.set(0, baseH * 0.62 + 0.012, s * (cushionW/2 - 0.018)); g.add(bol);
  }
  for (const s of [-1, 1]) {
    const bol = new THREE.Mesh(new THREE.BoxGeometry(backH * 0.20, backH * 0.92, 0.035), trim);
    bol.position.set(backX, backY, s * (cushionW/2 - 0.016));
    bol.rotation.z = tilt; g.add(bol);
  }
  return g;
}
function addCockpit(parent, spec) {
  const { xFront, xRear, yFloor, yRoof, halfWidth, neon: neonHex, extraRearRow, limoBar, police } = spec;
  const cabinLen = xFront - xRear;
  const cabinH   = yRoof - yFloor;
  const xMid     = (xFront + xRear) / 2;
  const cockpit = new THREE.Group(); cockpit.name = 'Cockpit';
  const leather = new THREE.MeshPhysicalMaterial({
    color: limoBar ? 0x2a1e10 : 0x1c1830, roughness: 0.80, metalness: 0.20, clearcoat: 0.30 });
  const trim = new THREE.MeshPhysicalMaterial({ color: 0x22222e, roughness: 0.38, metalness: 0.85, envMapIntensity: 1.1 });
  const carbon = new THREE.MeshPhysicalMaterial({ color: 0x08080f, roughness: 0.5, metalness: 0.6, clearcoat: 0.6 });
  const screenMat = new THREE.MeshStandardMaterial({
    color: 0x000000, emissive: new THREE.Color(neonHex), emissiveIntensity: 2.2, toneMapped: false, roughness: 0.25 });
  const accent = new THREE.MeshStandardMaterial({
    color: 0x000000, emissive: new THREE.Color(neonHex), emissiveIntensity: 2.8, toneMapped: false });
  const accentSoft = new THREE.MeshStandardMaterial({
    color: 0x000000, emissive: new THREE.Color(neonHex), emissiveIntensity: 1.1, toneMapped: false });
  const mats = { leather, trim, carbon, accent, accentSoft, screen: screenMat };
  const floor = new THREE.Mesh(new THREE.BoxGeometry(cabinLen * 1.00, 0.022, halfWidth * 2.0), leather);
  floor.position.set(xMid, yFloor + 0.011, 0); floor.receiveShadow = true; cockpit.add(floor);
  const fGlow = new THREE.Mesh(
    new THREE.PlaneGeometry(cabinLen * 0.60, halfWidth * 1.4),
    new THREE.MeshBasicMaterial({ color: neonHex, transparent: true, opacity: 0.35,
      blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false }));
  fGlow.rotation.x = -Math.PI / 2;
  fGlow.position.set(xMid - cabinLen * 0.05, yFloor + 0.024, 0); cockpit.add(fGlow);
  const dashDepth = Math.min(0.22, cabinLen * 0.14);
  const dashH     = Math.min(0.16, cabinH * 0.50);
  const dashX     = xFront - dashDepth / 2 - 0.02;
  const dash = new THREE.Mesh(new THREE.BoxGeometry(dashDepth, dashH, halfWidth * 2.0), trim);

function makeMotoPlateTexture(letters = 'A000AA', region = '00') {
  const W = 512, H = 256;
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#e6e6e6'; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = '#0a0a0a'; ctx.lineWidth = 10;
  ctx.strokeRect(6, 6, W - 12, H - 12);
  ctx.fillStyle = '#0a0a0a';
  ctx.font = 'bold 130px Arial, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(letters, W/2, H * 0.36);
  const flagW = 42, flagTop = H - 72, stripeH = 16;
  ctx.fillStyle = '#ffffff'; ctx.fillRect(W/2 - 100, flagTop, flagW, stripeH);
  ctx.fillStyle = '#0039a6'; ctx.fillRect(W/2 - 100, flagTop + stripeH, flagW, stripeH);
  ctx.fillStyle = '#d52b1e'; ctx.fillRect(W/2 - 100, flagTop + stripeH * 2, flagW, stripeH);
  ctx.fillStyle = '#0a0a0a';
  ctx.font = 'bold 46px Arial, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('RUS', W/2 - 50, H - 52);
  ctx.textAlign = 'center';
  ctx.font = 'bold 60px Arial, sans-serif';
  ctx.fillText(region, W/2 + 80, H - 52);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 16;
  return tex;
}
function addMotoPlate(bike, x, y, yRot, letters='A000AA', region='00', scale=1) {
  const w = 0.26 * scale, h = 0.13 * scale;
  const tex = makeMotoPlateTexture(letters, region);
  const mat = new THREE.MeshBasicMaterial({ map: tex, side: THREE.DoubleSide, toneMapped: true });
  const plate = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
  plate.position.set(x, y, 0); plate.rotation.y = yRot; bike.add(plate);
}

const CARS_CLASSIC = [

  { label: 'M4 · SPECTRE-CYCLE', neon: 0xa855f7, build: buildMotoSpectre,    camDist: 5.5, targetY: 0.65 },
  { label: 'M5 · KATANA-R ☕',   neon: 0xffb020, build: buildMotoKatana,     camDist: 5.0, targetY: 0.65 },
  { label: 'M6 · CHOPPER 🦅',    neon: 0xff6a00, build: buildMotoLeviathan,  camDist: 5.8, targetY: 0.85 },
  { label: 'M7 · COMET SCOOT 🛴',neon: 0xffffff, build: buildMotoComet,      camDist: 4.2, targetY: 0.50 },
  { label: 'M8 · TITAN TRAIL ⛰', neon: 0xff8000, build: buildMotoTitan,      camDist: 5.2, targetY: 0.75 },
  { label: 'M9 · ENFORCER INT 🔵',neon: 0x0088ff, build: buildMotoEnforcer,  camDist: 5.2, targetY: 0.70 },
  { label: 'M10 · PHANTOM RR 🔴',neon: 0xff1a1a, build: buildMotoPhantom,    camDist: 5.2, targetY: 0.70 }
];
const CARS = [...CARS_CLASSIC, ...CARS_CITY, ...CARS_HEAVY, ...CARS_MOTO];

let currentCar = null;
let currentIndex = 0;

/* === UI === */
const listEl1 = document.getElementById('carList1');
const listEl2 = document.getElementById('carList2');
const listEl3 = document.getElementById('carList3');
const listEl4 = document.getElementById('carList4');
const statusEl = document.getElementById('status');
function showStatus(msg, ms = 2200) {
  statusEl.textContent = msg;
  statusEl.classList.add('show');
  clearTimeout(showStatus._t);
  showStatus._t = setTimeout(() => statusEl.classList.remove('show'), ms);
}
CARS.forEach((car, i) => {
  const btn = document.createElement('button');
  btn.textContent = car.label;
  btn.addEventListener('click', () => selectCar(i));
  const list = i < 5 ? listEl1 : (i < 10 ? listEl2 : (i < 12 ? listEl3 : listEl4));
  list.appendChild(btn);
  car.btn = btn;
});
function selectCar(index) {
  if (currentCar) scene.remove(currentCar);
  currentIndex = index;
  currentCar = CARS[index].build();
  currentCar.position.set(0, 0, 0);
  scene.add(currentCar);
  groundGlowMat.color.setHex(CARS[index].neon);
  const cd = CARS[index].camDist || 12;
  const ty = CARS[index].targetY || 0.85;
  controls.target.set(0, ty, 0);
  const angle = Math.PI / 4;
  camera.position.set(Math.sin(angle) * cd * 0.75, cd * 0.40, Math.cos(angle) * cd * 0.75);
  controls.minDistance = cd * 0.35;
  controls.maxDistance = cd * 3.5;
  controls.update();
  CARS.forEach((c, i) => c.btn.classList.toggle('active', i === index));
}

/* === EXPORT === */
document.getElementById('export').addEventListener('click', () => {
  if (!currentCar) return;
  showStatus('ЭКСПОРТ...', 6000);
  const exporter = new GLTFExporter();
  exporter.parse(currentCar,
    (result) => {
      const blob = new Blob([result], { type: 'model/gltf-binary' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = (currentCar.name || 'cyberpunk_vehicle') + '.glb';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      showStatus('СОХРАНЕНО: ' + (currentCar.name || 'vehicle') + '.glb');
    },
    (err) => { console.error(err); showStatus('ОШИБКА ЭКСПОРТА'); },
    { binary: true, onlyVisible: true, includeCustomExtensions: false });
});

/* === POST === */
const composer = new EffectComposer(renderer);
composer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
composer.setSize(window.innerWidth, window.innerHeight);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight), 0.75, 0.55, 0.72);
composer.addPass(bloom);
composer.addPass(new OutputPass());

window.addEventListener('resize', () => {
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w / h; camera.updateProjectionMatrix();
  renderer.setSize(w, h); composer.setSize(w, h); bloom.setSize(w, h);
});

selectCar(0);
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  if (currentCar && currentCar.userData.hover) {
    currentCar.position.y = 0.10 + Math.sin(t * 1.35) * 0.055;
    currentCar.rotation.z = Math.sin(t * 0.85) * 0.009;
    currentCar.rotation.x = Math.sin(t * 1.05 + 1.3) * 0.006;
  }
  ringOuter.material.opacity = 0.65 + Math.sin(t * 2.2) * 0.25;
  ringInner.material.opacity = 0.40 + Math.sin(t * 2.2 + 1.6) * 0.20;
  controls.update();
  composer.render();
}
animate();
</script>
